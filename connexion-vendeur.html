
!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion vendeur | ABS Niger</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: #171717;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 30px 22px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 { color: #d4af37; margin-bottom: 8px; }

    .subtitle {
      color: #ccc;
      margin-bottom: 28px;
    }

    label {
      display: block;
      text-align: left;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #252525;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    a { color: #d4af37; }

    .links {
      margin-top: 24px;
      line-height: 2;
    }

    .message {
      color: #ffb4b4;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>🏪 ABS Niger</h1>
    <p class="subtitle">Espace de connexion vendeur</p>

    <form id="sellerLoginForm">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email"
             autocomplete="email" required
             placeholder="votre@email.com">

      <label for="password">Mot de passe</label>
      <input type="password" id="password"
             autocomplete="current-password" required
             placeholder="Votre mot de passe">

      <button type="submit" disabled>
        Connexion bientôt disponible
      </button>
    </form>

    <p id="message" class="message" role="status"></p>

    <div class="links">
      <p>Vous êtes nouveau vendeur ?</p>
