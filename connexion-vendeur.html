
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Connexion vendeur | ABS Niger</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #171717;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 30px 22px;
      text-align: center;
    }

    h1 { color: #d4af37; }

    .subtitle {
      color: #ccc;
      margin-bottom: 28px;
    }

    label {
      display: block;
      text-align: left;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #252525;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    a { color: #d4af37; }

    .links {
      margin-top: 24px;
      line-height: 2;
    }

    #message {
      margin-top: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>🏪 ABS Niger</h1>
    <p class="subtitle">Espace de connexion vendeur</p>

    <form id="sellerLoginForm">
      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="votre@email.com"
        autocomplete="email"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginBtn">
        Se connecter
      </button>
    </form>

    <p id="message" role="status"></p>

    <div class="links">
      <p>Vous êtes nouveau vendeur ?</p>
      <a href="vendeur.html">Devenir vendeur</a>
      <br>
      <a href="index.html">← Retour à la boutique</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAPTXI1XgocRJtN3FDMUTMwBgiUzG8ymk",
      authDomain: "abs-boutique.firebaseapp.com",
      projectId: "abs-boutique",
      storageBucket: "abs-boutique.firebasestorage.app",
      messagingSenderId: "935883852934",
      appId: "1:935883852934:web:7b410699768c024860d507"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("sellerLoginForm");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      message.style.color = "#d4af37";
      message.textContent = "Vérification en cours...";

      try {
        const result = await signInWithEmailAndPassword(
          auth, email, password
        );

        const uid = result.user.uid;
        const sellerRef = doc(db, "sellers", uid);
        const sellerSnap = await getDoc(sellerRef);

        if (!sellerSnap.exists()) {
          await signOut(auth);
          message.style.color = "#ff7777";
          message.textContent =
            "Aucun compte vendeur associé à cet utilisateur.";
          return;
        }

        const seller = sellerSnap.data();

        if (seller.ownerUid !== uid) {
          await signOut(auth);
          message.style.color = "#ff7777";
          message.textContent =
            "Le compte vendeur ne correspond pas.";
          return;
        }

        if (seller.status === "approved") {
          message.style.color = "#6ee7a0";
          message.textContent =
            "Bienvenue " + (seller.shopName || "vendeur") +
            " ! Votre compte vendeur est approuvé.";
        } else {
          await signOut(auth);

          if (seller.status === "pending") {
            message.style.color = "#d4af37";
            message.textContent =
              "Votre demande est en attente d'approbation.";
          } else {
            message.style.color = "#ff7777";
            message.textContent =
              "Votre compte vendeur n'est pas autorisé.";
          }
        }

      } catch (error) {
        message.style.color = "#ff7777";

        if (error.code === "permission-denied") {
          message.textContent =
            "Accès Firestore refusé. Vérifiez les règles de sécurité.";
        } else if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          message.textContent =
            "E-mail ou mot de passe incorrect.";
        } else {
          message.textContent =
            "Connexion impossible. Veuillez réessayer.";
        }
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
