
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABS Boutique | Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101012;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#080808;border-bottom:2px solid #d4af37}
h1{color:#d4af37;margin:0;font-size:24px}
main{max-width:950px;margin:auto;padding:20px}
.card{background:#1b1b1f;padding:18px;border-radius:12px;margin:16px 0}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;font-size:15px}
input,textarea{background:#29292e;color:white;border:1px solid #555}
button{background:#d4af37;color:#111;font-weight:bold;border:0;cursor:pointer}
button.secondary{background:#38383e;color:white}
button.danger{background:#9f3030;color:white}
.product{border-bottom:1px solid #444;padding:14px 0}
.product strong{color:#d4af37}
.small{font-size:13px;color:#ccc}
#app{display:none}
#status{white-space:pre-wrap;color:#f0d477}
.actions{display:flex;gap:8px}
.actions button{flex:1}
</style>
</head>
<body>
<header>
  <h1>ABS BOUTIQUE</h1>
  <p>Administration de la boutique</p>
</header>

<main>
  <section id="login" class="card">
    <h2>Connexion administrateur</h2>
    <p class="small">Connectez-vous avec votre compte administrateur ABS.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Adresse e-mail" required>
      <input id="password" type="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
  </section>

  <section id="app">
    <div class="card">
      <h2>Gestion des produits</h2>
      <p class="small">Ajoutez un produit ou modifiez un produit existant.</p>
      <form id="productForm">
        <input id="name" placeholder="Nom du produit" required>
        <input id="cat" placeholder="Catégorie : Parfums, Sacs, Chaussures..." required>
        <input id="price" type="number" min="0" placeholder="Prix en FCFA" required>
        <label for="imageFile">📸 Photo du produit</label>

<input
  id="imageFile"
  type="file"
  accept="image/*"
>

<p class="small">
  Choisissez une photo depuis votre téléphone.
</p>

<input
  id="image"
  type="hidden"
>
        <input id="icon" placeholder="Icône (ex. ✦)">
        <textarea id="description" placeholder="Description du produit" required></textarea>
        <button id="saveButton" type="submit">Ajouter le produit</button>
        <button class="secondary" id="cancelEdit" type="button" hidden>Annuler la modification</button>
      </form>
    </div>

    <div class="card">
      <h2>Produits enregistrés</h2>
      <p id="count">Chargement...</p>
      <div id="products"></div>
    </div>

    <button class="secondary" id="logout" type="button">Se déconnecter</button>
  </section>

  <p id="status" role="status"></p>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAPTXI1XgocRJtN3FDMUTMwBgiUzG8ymk",
  authDomain: "abs-boutique.firebaseapp.com",
  projectId: "abs-boutique",
  storageBucket: "abs-boutique.firebasestorage.app",
  messagingSenderId: "935883852934",
  appId: "1:935883852934:web:7b410699768c024860d507"
};

const ADMIN_UID = "XVebtipVneS4wCOR3yHCUOcuFM03";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const login = document.querySelector("#login");
const dashboard = document.querySelector("#app");
const status = document.querySelector("#status");
const form = document.querySelector("#productForm");
const productsBox = document.querySelector("#products");
let editingDocId = null;
let productRows = [];
// ABS BOUTIQUE - CLOUDINARY PHOTO UPLOAD

const CLOUD_NAME = "llyzxrbi";
const UPLOAD_PRESET = "abs_boutique_products";

async function uploadProductImage(file) {
  const allowedTypes = ["image/jpeg", "image/png", "image/webp"];

  if (!allowedTypes.includes(file.type)) {
    throw new Error("Choisissez une image JPG, PNG ou WebP.");
  }

  if (file.size > 5 * 1024 * 1024) {
    throw new Error("La photo ne doit pas dépasser 5 Mo.");
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {
      method: "POST",
      body: formData
    }
  );

  const result = await response.json();

  if (!response.ok || !result.secure_url) {
    throw new Error(result.error?.message || "Échec de l'envoi de la photo.");
  }

  return result.secure_url;
}

function message(text) {
  status.textContent = text;
}

function showLogin() {
  login.style.display = "block";
  dashboard.style.display = "none";
}

function showDashboard() {
  login.style.display = "none";
  dashboard.style.display = "block";
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    showLogin();
    return;
  }

  if (user.uid !== ADMIN_UID) {
    await signOut(auth);
    showLogin();
    message("Accès refusé : ce compte n'est pas administrateur.");
    return;
  }

  showDashboard();
  await loadProducts();
});

document.querySelector("#loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  message("Connexion en cours...");

  try {
    await signInWithEmailAndPassword(
      auth,
      document.querySelector("#email").value.trim(),
      document.querySelector("#password").value
    );
    message("Connexion réussie.");
  } catch (error) {
    message("Erreur Firebase : " + error.code + " - " + error.message);
  }
});

async function loadProducts() {
  productsBox.textContent = "Chargement des produits...";
  try {
    const snapshot = await getDocs(collection(db, "products"));
console.log(
  "ABS Firestore products:",
  snapshot.docs.map(item => ({
    docId: item.id,
    ...item.data()
  }))
);
    productRows = snapshot.docs.map(item => ({
      docId: item.id,
      ...item.data()
    })).sort((a, b) => Number(a.id || 0) - Number(b.id || 0));

    document.querySelector("#count").textContent =
      productRows.length + " produit(s)";

    productsBox.replaceChildren();

    if (!productRows.length) {
      productsBox.textContent = "Aucun produit trouvé.";
      return;
    }

    productRows.forEach(product => {
      const row = document.createElement("div");
      row.className = "product";

      const title = document.createElement("strong");
      title.textContent = product.name || product.Name || "Produit sans nom";

      const details = document.createElement("p");
details.textContent =
  (product.cat || product.category || "Sans catégorie") +
  " · " + Number(product.price ?? product.Price ?? 0).toLocaleString("fr-FR") +
  " FCFA";

      const edit = document.createElement("button");
      edit.textContent = "Modifier";
      edit.addEventListener("click", () => editProduct(product.docId));

      const remove = document.createElement("button");
      remove.className = "danger";
      remove.textContent = "Supprimer";
      remove.addEventListener("click", () => removeProduct(product));

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(edit, remove);
      row.append(title, details, actions);
      productsBox.append(row);
    });
  } catch (error) {
    productsBox.textContent = "Impossible de charger les produits.";
    message("Erreur Firestore : " + error.message);
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    message("Accès refusé.");
    return;
  }

    const existing = productRows.find(p => p.docId === editingDocId);

  const selectedFile = document.querySelector("#imageFile").files[0];
  let imageValue = document.querySelector("#image").value.trim();

  try {
    if (selectedFile) {
      message("📸 Envoi de la photo en cours...");
      imageValue = await uploadProductImage(selectedFile);
    } else if (existing) {
      imageValue = existing.image || "";
    } else {
      message("Veuillez choisir une photo du produit.");
      return;
    }
  } catch (error) {
    message("Erreur photo : " + error.message);
    return;
  }

  const product = {
    id: existing ? Number(existing.id) : Math.max(0, ...productRows.map(p => Number(p.id) || 0)) + 1,
    name: document.querySelector("#name").value.trim(),
    cat: document.querySelector("#cat").value.trim(),
    category: document.querySelector("#cat").value.trim(),
    price: Number(document.querySelector("#price").value),
    image: imageValue,
    icon: document.querySelector("#icon").value.trim(),
    description: document.querySelector("#description").value.trim()
  };

  if (!product.name || !product.cat || !product.image ||
      !Number.isFinite(product.price) || product.price < 0) {
    message("Vérifiez les informations du produit.");
    return;
  }

  try {
    if (editingDocId) {
      await updateDoc(doc(db, "products", editingDocId), product);
      message("Produit modifié.");
    } else {
      await addDoc(collection(db, "products"), product);
      message("Produit ajouté.");
    }

    resetForm();
    await loadProducts();
  } catch (error) {
    message("Enregistrement impossible : " + error.message);
  }
});

function editProduct(docId) {
  const p = productRows.find(item => item.docId === docId);
  if (!p) return;

  editingDocId = docId;
  document.querySelector("#name").value = p.name || "";
  document.querySelector("#cat").value = p.cat || p.category || "";
  document.querySelector("#price").value = p.price ?? "";
  document.querySelector("#image").value = p.image || "";
  document.querySelector("#icon").value = p.icon || "";
  document.querySelector("#description").value = p.description || "";
  document.querySelector("#saveButton").textContent = "Enregistrer les modifications";
  document.querySelector("#cancelEdit").hidden = false;
  document.querySelector("#name").scrollIntoView({behavior:"smooth", block:"center"});
}

async function removeProduct(p) {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    message("Accès refusé.");
    return;
  }
  if (!confirm("Supprimer « " + p.name + " » ? Cette action est irréversible.")) return;

  try {
    await deleteDoc(doc(db, "products", p.docId));
    message("Produit supprimé.");
    await loadProducts();
  } catch (error) {
    message("Suppression impossible : " + error.message);
  }
}

function resetForm() {
  editingDocId = null;
  form.reset();
  document.querySelector("#saveButton").textContent = "Ajouter le produit";
  document.querySelector("#cancelEdit").hidden = true;
}

document.querySelector("#cancelEdit").addEventListener("click", resetForm);

document.querySelector("#logout").addEventListener("click", async () => {
  await signOut(auth);
  message("Vous êtes déconnecté.");
});
</script>
</body>
          </html>
