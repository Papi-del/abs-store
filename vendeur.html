
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devenir vendeur | ABS Niger</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101012;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  padding:22px;
  text-align:center;
  border-bottom:2px solid #d4af37;
}
h1{color:#d4af37;margin:0}
main{max-width:480px;margin:35px auto;padding:16px}
.card{
  background:#1b1b1f;
  padding:24px;
  border-radius:14px;
}
h2{color:#d4af37}
input,button{
  width:100%;
  padding:13px;
  margin:9px 0;
  border-radius:8px;
  font-size:15px;
}
input{
  background:#29292e;
  border:1px solid #555;
  color:white;
}
button{
  background:#d4af37;
  color:#111;
  font-weight:bold;
  border:0;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
a{color:#d4af37}
#message{line-height:1.6;white-space:pre-line}
.small{color:#bbb;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>ABS NIGER</h1>
  <p>Espace vendeurs</p>
</header>

<main>
  <div class="card">
    <h2>Devenir vendeur</h2>
    <p>Créez votre boutique sur ABS Niger.</p>

    <form id="sellerForm">
      <input id="shopName"
        placeholder="Nom de votre boutique"
        maxlength="100" required>

      <input id="phone"
        type="tel"
        placeholder="Numéro de téléphone"
        maxlength="30" required>

      <input id="email"
        type="email"
        placeholder="Adresse e-mail"
        autocomplete="email" required>

      <input id="password"
        type="password"
        placeholder="Mot de passe (6 caractères minimum)"
        minlength="6"
        autocomplete="new-password" required>

      <button id="registerBtn" type="submit">
        Envoyer ma demande
      </button>
    </form>

    <p id="message" role="status"></p>

    <p class="small">
      Votre boutique sera examinée par
      l'administration ABS avant publication.
    </p>

    <p><a href="index.html">← Retour à la boutique</a></p>
  </div>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAPTXI1XgocRJtN3FDMUTMwBgiUzG8ymk",
  authDomain: "abs-boutique.firebaseapp.com",
  projectId: "abs-boutique",
  storageBucket: "abs-boutique.firebasestorage.app",
  messagingSenderId: "935883852934",
  appId: "1:935883852934:web:7b410699768c024860d507"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("sellerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerBtn");

form.addEventListener("submit", async event => {
  event.preventDefault();

  button.disabled = true;
  message.textContent = "Enregistrement en cours...";

  const shopName =
    document.getElementById("shopName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  try {
    const credential =
      await createUserWithEmailAndPassword(
        auth, email, password
      );

    await setDoc(
      doc(db, "sellers", credential.user.uid),
      {
        ownerUid: credential.user.uid,
        shopName: shopName,
        phone: phone,
        status: "pending",
        createdAt: serverTimestamp()
      }
    );

    message.textContent =
      "Demande envoyée avec succès !\n" +
      "Votre boutique attend l'approbation ABS.";

    form.reset();

  } catch (error) {
    console.error(error);

    message.textContent =
      "Erreur : " + error.message +
      "\nSi votre compte a été créé, " +
      "ne créez pas un deuxième compte.";
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
